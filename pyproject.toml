[build-system]
requires = [
    "hatchling>=1.27",
    "hatch-vcs>=0.5",
]
build-backend = "hatchling.build"

[project]
name = "py-cord"
authors = [
    { name = "Pycord Development" }
]
description = "A Python wrapper for the Discord API"
readme = { content-type = "text/x-rst", file = "README.rst" }
requires-python = ">=3.10, <3.15"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "aiohttp>=3.13.2,<4.0",
    "typing_extensions>=4.12.0,<5",
]

[project.optional-dependencies]
speed = [
    "msgspec~=0.21.0",
    "aiohttp[speedups]",
]
voice = [
    "PyNaCl>=1.6.2,<1.7",
    "davey>=0.1.4,<1",
]

[project.urls]
Homepage = "https://pycord.dev"
Changelog = "https://docs.pycord.dev/en/master/changelog.html"
Source = "https://github.com/Pycord-Development/pycord"
Documentation = "https://docs.pycord.dev"
Tracker = "https://github.com/Pycord-Development/pycord/issues"
Funding = "https://patreon.com/pycord"

[dependency-groups]
dev = [
    "pylint~=4.0.5",
    "mypy~=2.3.0",
    "coverage~=7.10",
    "pre-commit==4.6.2",
    "codespell==2.4.3",
    "bandit==1.9.4",
    "flake8==7.3.0",
    "tox>=4.27.0",
    "tox-gh>=1.5.0",
    "tox-uv>=1.36.0",
    # Formatters are strongly pinned to avoid formatting breaking in production
    "mdformat==1.0",
    "mdformat-gfm~=1.0",
    "mdformat-gfm-alerts~=2.1",
    "black==26.10.0",
    { include-group = "test" },
]
test = [
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
]

docs = [
    "sphinx==9.1.0",
    "sphinxcontrib_trio==1.2.0",
    "myst-parser[linkify]==5.1.0",
    "sphinxext-opengraph==0.13.0",
    "sphinx-copybutton==0.5.2",
    "furo==2025.12.19",
    "sphinx-autodoc-typehints==3.13.6",
    "sphinx-intl==2.4.0",
    "typing_extensions==4.16.0",
    # used by scripts/docs_json_exporter.py to parse the built HTML
    "beautifulsoup4~=4.12",
]
release = [
    "build>=1.2.1",
    "twine>=5.1.1",
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.13" }

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
artifacts = [
    "/discord/emojis.json",
    "/discord/_version.py",
]

[tool.hatch.build.hooks.vcs]
version-file = "discord/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["discord"]

[tool.hatch.build.targets.sdist]
include = [
    "/discord",
    "/LICENSE",
    "/README.rst",
]

[tool.black]
target-version = ['py310', 'py311', 'py312', 'py313', 'py314']

[tool.isort]
profile = "black"

[tool.mypy]
namespace_packages = true
install_types = true
strict = true
show_error_codes = true
#allow_untyped_decorators = true
#allow_untyped_calls = true
ignore_errors = true

[tool.pylint.main]
extension-pkg-whitelist = [
    "pydantic",
    "ujson"
]
py-version = "3.10"
ignore-patterns = ["_version\\.py"]
load-plugins = [
    "pylint.extensions.comparison_placement",
    "pylint.extensions.consider_refactoring_into_while_condition",
    "pylint.extensions.dict_init_mutate",
    "pylint.extensions.dunder",
    "pylint.extensions.empty_comment",
    "pylint.extensions.for_any_all",
    "pylint.extensions.overlapping_exceptions",
]

[tool.pylint.dunder]
good-dunder-names = ["__members__"]

[tool.pylint.messages_control]
# Allowlist so we only have messages not already covered by type checkers or by black/isort/pre-commit/codespell etc...
disable = ["all"]
enable = [
    # whole checkers:
    "bad-chained-comparison", "dataclass", "lambda-expressions", "logging", "modified_iteration",
    "nested_min_max", "newstyle", "nonascii-checker", "threading", "unicode_checker",
    "unnecessary-dunder-call", "unnecessary_ellipsis",
    # extensions
    "comparison-placement", "consider_refactoring_into_while", "dict-init-mutate", "dunder",
    "empty-comment", "consider-using-any-or-all", "overlap-except",
    # pragma hygiene
    "bad-inline-option", "deprecated-pragma", "unrecognized-inline-option", "use-symbolic-message-instead",
    "useless-suppression",
    # basic
    "assert-on-string-literal", "bad-reversed-sequence", "break-in-finally", "comparison-of-constants",
    "comparison-with-callable", "comparison-with-itself", "confusing-with-statement",
    "contextmanager-generator-missing-cleanup", "continue-in-finally", "dangerous-default-value",
    "duplicate-key", "duplicate-value", "empty-docstring", "eval-used", "exec-used", "init-is-generator",
    "literal-comparison", "lost-exception", "misplaced-format-function", "missing-module-docstring",
    "missing-parentheses-for-call-in-test", "nan-comparison", "nonexistent-operator",
    "pointless-exception-statement", "pointless-string-statement", "redeclared-assigned-name",
    "return-in-finally", "return-in-init", "self-assigning-variable", "singleton-comparison",
    "unidiomatic-typecheck", "unnecessary-pass", "useless-else-on-loop", "using-constant-test",
    # classes
    "access-member-before-definition", "implicit-flag-alias", "invalid-slots", "invalid-slots-object",
    "no-classmethod-decorator", "no-staticmethod-decorator", "property-with-parameters",
    "redefined-slots-in-subclass", "single-string-used-for-slots", "super-without-brackets",
    "unexpected-special-method-signature", "useless-object-inheritance", "useless-parent-delegation",
    # exceptions
    "bare-except", "binary-op-exception", "broad-exception-raised", "duplicate-except",
    "misplaced-bare-raise", "notimplemented-raised", "raising-format-tuple", "try-except-raise",
    "wrong-exception-operation",
    # imports
    "consider-using-from-import", "misplaced-future", "reimported", "shadowed-import",
    # match
    "bare-name-capture-pattern", "match-class-bind-self", "match-class-positional-attributes",
    "multiple-class-sub-patterns", "too-many-positional-sub-patterns",
    # method_args
    "missing-timeout",
    # refactoring
    "chained-comparison", "condition-evals-to-constant", "consider-iterating-dictionary",
    "consider-merging-isinstance", "consider-swap-variables", "consider-using-dict-comprehension",
    "consider-using-dict-items", "consider-using-enumerate", "consider-using-generator", "consider-using-get",
    "consider-using-in", "consider-using-join", "consider-using-max-builtin", "consider-using-min-builtin",
    "consider-using-set-comprehension", "consider-using-sys-exit", "consider-using-ternary",
    "no-else-break", "no-else-continue", "redefined-argument-from-local", "simplifiable-condition",
    "simplifiable-if-expression", "simplifiable-if-statement", "simplify-boolean-expression",
    "stop-iteration-return", "super-with-arguments", "trailing-comma-tuple", "unnecessary-comprehension",
    "unnecessary-dict-index-lookup", "unnecessary-list-index-lookup", "unnecessary-negation",
    "use-a-generator", "use-dict-literal", "use-implicit-booleaness-not-comparison",
    "use-implicit-booleaness-not-comparison-to-string", "use-implicit-booleaness-not-len", "use-list-literal",
    "use-maxsplit-arg", "use-sequence-for-iteration", "use-yield-from", "useless-return",
    # stdlib (deprecated-* left to basedpyright's reportDeprecated)
    "bad-open-mode", "bad-thread-instantiation", "boolean-datetime", "forgotten-debug-statement",
    "invalid-envvar-default", "invalid-envvar-value", "method-cache-max-size-none", "redundant-unittest-assert",
    "shallow-copy-environ", "singledispatch-method", "singledispatchmethod-function",
    "subprocess-popen-preexec-fn", "subprocess-run-check", "unspecified-encoding",
    # string (anomalous-backslash / implicit-str-concat left to basedpyright)
    "anomalous-unicode-escape-in-string", "bad-format-character", "bad-format-string", "bad-format-string-key",
    "bad-str-strip-call", "bad-string-format-type", "duplicate-string-formatting-argument",
    "f-string-without-interpolation", "format-combined-specification", "format-needs-mapping",
    "format-string-without-interpolation", "invalid-format-index", "missing-format-argument-key",
    "missing-format-attribute", "missing-format-string-key", "mixed-format-string", "too-few-format-args",
    "too-many-format-args", "truncated-format-string", "unused-format-string-argument",
    "unused-format-string-key",
    # variables
    "global-at-module-level", "global-variable-not-assigned", "global-variable-undefined",
    "possibly-unused-variable", "self-cls-assignment", "unbalanced-dict-unpacking", "undefined-loop-variable",
]

[tool.pytest]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.tox]
requires = ["tox>=4", "tox-uv>=1.36.0"]
env_list = ["3.14", "3.13", "3.12", "3.11", "3.10", "3.14-novoice"]

[tool.tox.env_run_base]
description = "run unit tests"
commands = [["pytest", { replace = "posargs", default = ["tests"], extend = true }]]
runner = "uv-venv-lock-runner"
uv_sync_flags = ["--frozen"]
dependency_groups = ["test"]
extras = ["voice"]

[tool.tox.env."3.14-novoice"]
description = "run import and warning tests without the voice extra"
commands = [[
    "pytest",
    { replace = "posargs", default = ["tests/voice/test_dependency_behavior.py"], extend = true }
]]
dependency_groups = ["test"]
extras = []

# GitHub actions
[tool.tox.gh.python]
"3.14" = ["3.14", "3.14-novoice"]
"3.13" = ["3.13"]
"3.12" = ["3.12"]
"3.11" = ["3.11"]
"3.10" = ["3.10"]

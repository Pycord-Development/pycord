[build-system]
requires = [
    "hatchling>=1.27",
    "hatch-vcs>=0.5",
]
build-backend = "hatchling.build"

[project]
name = "py-cord"
authors = [
    { name = "Pycord Development" }
]
description = "A Python wrapper for the Discord API"
readme = { content-type = "text/x-rst", file = "README.rst" }
requires-python = ">=3.10, <3.15"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "aiohttp>=3.13.2,<4.0",
    "typing_extensions>=4.12.0,<5",
]

[project.optional-dependencies]
speed = [
    "msgspec~=0.21.0",
    "aiohttp[speedups]",
]
voice = [
    "PyNaCl>=1.6.2,<1.7",
    "davey>=0.1.4,<1",
]

[project.urls]
Homepage = "https://pycord.dev"
Changelog = "https://docs.pycord.dev/en/master/changelog.html"
Source = "https://github.com/Pycord-Development/pycord"
Documentation = "https://docs.pycord.dev"
Tracker = "https://github.com/Pycord-Development/pycord/issues"
Funding = "https://patreon.com/pycord"

[dependency-groups]
dev = [
    "pylint~=4.0.5",
    "mypy~=2.3.0",
    "coverage~=7.10",
    "pre-commit==4.6.2",
    "codespell==2.4.3",
    "bandit==1.9.4",
    "flake8==7.3.0",
    "tox>=4.27.0",
    "tox-gh>=1.5.0",
    "tox-uv>=1.36.0",
    "mdformat~=1.0",
    "mdformat-gfm~=1.0",
    "mdformat-gfm-alerts~=2.1",
    { include-group = "test" },
]
test = [
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
]

docs = [
    "sphinx==9.1.0",
    "sphinxcontrib_trio==1.2.0",
    "myst-parser[linkify]==5.1.0",
    "sphinxext-opengraph==0.13.0",
    "sphinx-copybutton==0.5.2",
    "furo==2025.12.19",
    "sphinx-autodoc-typehints==3.13.2",
    "sphinx-intl==2.3.2",
    "typing_extensions==4.16.0",
    # used by scripts/docs_json_exporter.py to parse the built HTML
    "beautifulsoup4~=4.12",
]
release = [
    "build>=1.2.1",
    "twine>=5.1.1",
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.13" }

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
artifacts = [
    "/discord/emojis.json",
    "/discord/_version.py",
]

[tool.hatch.build.hooks.vcs]
version-file = "discord/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["discord"]

[tool.hatch.build.targets.sdist]
include = [
    "/discord",
    "/LICENSE",
    "/README.rst",
]

[tool.black]
target-version = ['py310', 'py311', 'py312', 'py313', 'py314']

[tool.isort]
profile = "black"

[tool.mypy]
namespace_packages = true
install_types = true
strict = true
show_error_codes = true
#allow_untyped_decorators = true
#allow_untyped_calls = true
ignore_errors = true

[tool.pylint.main]
extension-pkg-whitelist = [
    "pydantic",
    "ujson"
]
py-version = 3.10

[tool.pylint.messages_control]
enable = [
    "bad-indentation",
    "line-too-long"
]
disable = [
    "protected-access",
    "fixme"
]

[tool.pylint.format]
indent-string = '    '
max-line-length = 120

[tool.pytest]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.tox]
requires = ["tox>=4", "tox-uv>=1.36.0"]
env_list = ["3.14", "3.13", "3.12", "3.11", "3.10", "3.14-novoice"]

[tool.tox.env_run_base]
description = "run unit tests"
commands = [["pytest", { replace = "posargs", default = ["tests"], extend = true }]]
runner = "uv-venv-lock-runner"
uv_sync_flags = ["--frozen"]
dependency_groups = ["test"]
extras = ["voice"]

[tool.tox.env."3.14-novoice"]
description = "run import and warning tests without the voice extra"
commands = [[
    "pytest",
    { replace = "posargs", default = ["tests/voice/test_dependency_behavior.py"], extend = true }
]]
dependency_groups = ["test"]
extras = []

# GitHub actions
[tool.tox.gh.python]
"3.14" = ["3.14", "3.14-novoice"]
"3.13" = ["3.13"]
"3.12" = ["3.12"]
"3.11" = ["3.11"]
"3.10" = ["3.10"]

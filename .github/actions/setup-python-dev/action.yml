name: "Setup Python dev environment"
description: "Set up Python and install development dependencies."

inputs:
  python-version:
    description: "Python version to install."
    required: true
  install-voice:
    description: "Install the voice extra."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: "Setup Python"
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: "pip"
        cache-dependency-path: |
          pyproject.toml
          requirements/*.txt

    - name: "Install dependencies"
      if: ${{ inputs.install-voice != 'true' }}
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install . --group dev

    - name: "Install dependencies with voice extra"
      if: ${{ inputs.install-voice == 'true' }}
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install ".[voice]" --group dev

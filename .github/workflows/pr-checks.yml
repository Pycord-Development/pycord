name: "Pull Request Checks"

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-dependencies:
    runs-on: ubuntu-latest
    name: "Check PR Dependencies"
    steps:
      - name: PR Dependency Check
        uses: gregsdennis/dependencies-action@1ba6872857f9adb872a430d5beb027fe10344086 # v1.4.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  semantic-title:
    name: "Check Semantic Title"
    runs-on: ubuntu-latest
    steps:
      - name: "Check Semantic Pull Request"
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

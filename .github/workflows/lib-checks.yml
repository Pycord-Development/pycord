name: "Library Checks"

on:
  push:
    paths:
      - "discord/**"
      - "examples/**"
      - "uv.lock"
      - "tests/**"
      - ".github/actions/**"
      - ".github/workflows/lib-checks.yml"
      - "LICENSE"
      - "README.rst"
      - "*.toml"
      - "*.py"
      - ".*"
    branches: [ master ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      lib: ${{ steps.filter.outputs.lib }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - name: "Check changed paths"
        id: filter
        uses: actions/github-script@v9.0.0
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('lib', 'true');
              core.setOutput('deps', 'false');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const matches = (file) => (
              file.startsWith('discord/') ||
              file.startsWith('examples/') ||
              file === 'uv.lock' ||
              file.startsWith('tests/') ||
              file.startsWith('.github/actions/') ||
              file === '.github/workflows/lib-checks.yml' ||
              file === 'LICENSE' ||
              file === 'README.rst' ||
              (!file.includes('/') && file.endsWith('.toml')) ||
              (!file.includes('/') && file.endsWith('.py')) ||
              /^\.[^/]+$/.test(file)
            );

            const changed = files.some((file) => matches(file.filename));
            core.setOutput('lib', changed ? 'true' : 'false');
            core.setOutput('deps', files.some((file) => file.filename === 'uv.lock') ? 'true' : 'false');

            if (!changed) {
              core.notice('Library checks skipped because no changed files matched the library check paths.');
              await core.summary
                .addHeading('Library checks skipped', 2)
                .addRaw('No changed files matched the library check paths.')
                .write();
            }

  uv-lock:
    needs: [ changes ]
    if: ${{ needs.changes.outputs.lib == 'true' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7.0.1
      - name: "Install uv"
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: false
      - name: "Check uv.lock is up to date"
        run: uv lock --check --refresh
  codespell:
    needs: [ changes ]
    if: ${{ needs.changes.outputs.lib == 'true' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7.0.1
      - name: "Setup uv"
        uses: $/.github/actions/setup-uv
        with:
          python-version: "3.14"
          groups: "dev"
      - name: "Run codespell"
        run:
          codespell --ignore-words-list="groupt,nd,ot,ro,falsy,BU" \
          --exclude-file=".github/workflows/codespell.yml"
  bandit:
    needs: [ changes ]
    if: ${{ needs.changes.outputs.lib == 'true' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7.0.1
      - name: "Setup uv"
        uses: $/.github/actions/setup-uv
        with:
          python-version: "3.14"
          groups: "dev"
      - name: "Run bandit"
        run: bandit --recursive --exclude ./.venv --skip B101,B104,B105,B110,B307,B311,B404,B603,B607 .
  pylint:
    needs: [ changes ]
    if: ${{ needs.changes.outputs.lib == 'true' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7.0.1
      - name: "Setup uv"
        uses: $/.github/actions/setup-uv
        with:
          python-version: "3.14"
          groups: "dev"
      - name: "Setup cache"
        id: cache-pylint
        uses: actions/cache@v6.1.0
        with:
          path: .pylint.d
          key: pylint-${{ runner.os }}-py3.14-${{ hashFiles('pyproject.toml', 'discord/**/*.py') }}
          restore-keys: |
            pylint-${{ runner.os }}-py3.14-
      - name: "Run pylint"
        run: |
          pylint discord/ \
            --output-format=github
  typecheck:
    needs: [ changes ]
    if: ${{ needs.changes.outputs.lib == 'true' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout PR Base"
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: "Setup uv"
        uses: $/.github/actions/setup-uv
        with:
          python-version: "3.14"
          groups: "dev"
      - name: "Write baseline"
        # We silence --writebaseline's output because otherwise it is picked up by GitHub code quality
        run: |
          set +e
          basedpyright --writebaseline --baselinefile "$RUNNER_TEMP/basedpyright-baseline.json" >/dev/null 2>&1
          exit 0
      - name: "Checkout PR Head"
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Necessary because otherwise untracked files like _version.py are dropped
          clean: 'false'
      - name: "Sync uv"
        run: uv sync --no-default-groups --frozen --group dev
      - name: "Run basedpyright"
        run: basedpyright --baselinefile "$RUNNER_TEMP/basedpyright-baseline.json" --baselinemode=auto
  flake8:
    needs: [ changes ]
    if: ${{ needs.changes.outputs.lib == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7.0.1
      - name: "Setup uv"
        uses: $/.github/actions/setup-uv
        with:
          python-version: "3.14"
          groups: "dev"
      - name: "Lint with flake8"
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
  tests:
    needs: [ changes ]
    if: ${{ needs.changes.outputs.lib == 'true' && needs.changes.outputs.deps != 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.10", "3.14" ]
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7.0.1
      - name: "Setup uv"
        uses: $/.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}
          groups: "tox"

      - name: "Run tests"
        run: tox
  tests-full:
    needs: [ changes ]
    if: ${{ needs.changes.outputs.lib == 'true' && (needs.changes.outputs.deps == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7.0.1
      - name: "Setup uv"
        uses: $/.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}
          groups: "tox"

      - name: "Run tests"
        run: tox
  tests-pass: # ref: https://github.com/orgs/community/discussions/4324#discussioncomment-3477871
    runs-on: ubuntu-latest
    needs: [ changes, tests, tests-full ]
    if: always()
    steps:
      - name: Tests succeeded
        if: ${{ !(contains(needs.*.result, 'failure')) && !(contains(needs.*.result, 'cancelled')) }}
        run: exit 0
      - name: Tests failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
